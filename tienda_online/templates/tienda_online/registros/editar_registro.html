{% extends "base.html" %}

{% block titulo %}Editar Registro - Tienda Online{% endblock %}

{% block contenido %}
<div class="max-w-2xl mx-auto space-y-6">

    <div class="bg-white p-8 rounded-2xl border border-indigo-100 shadow-sm space-y-6">
        <div>
            <h3 class="text-2xl font-black text-slate-900 tracking-tight">Editar registro</h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                Modifica los datos del producto y presiona Guardar para confirmar los cambios.
            </p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="{% url 'listado_registros' %}" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="px-5 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-sm transition-colors cursor-pointer">
                    Guardar
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
